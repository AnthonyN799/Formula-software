name: Daily Stock Alert Email

on:
  schedule:
    # 06:00 UTC corresponds to exactly 08:00 AM in Beirut (EET)
    - cron: '0 6 * * *'
  workflow_dispatch: # This allows you to click a button to test it manually!

jobs:
  check-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Run Alert Script
        env:
          SUPABASE_URL: ${{ secrets.SUPA_URL }}
          SUPABASE_KEY: ${{ secrets.SUPA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python stock_alert.py
